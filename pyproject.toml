[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "to-build-a-fire"
version = "0.1.0"
description = "Evidence-driven human-attention routing for merge requests"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Anna Tchijova" }]
dependencies = []

[project.scripts]
tbaf-route = "tbaf.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
