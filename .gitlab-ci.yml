stages:
  - verify

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

python-contract:
  stage: verify
  image: python:3.12-slim
  variables:
    PYTHONDONTWRITEBYTECODE: "1"
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
  script:
    - python --version
    - PYTHONPATH=src python -m unittest discover -s tests -v

# This job exercises the deterministic router in GitLab CI and publishes its
# receipt. The input uses illustrative SHAs and is not evidence about this
# pipeline's own merge request; MR-bound capture and checks remain future work.
attention-router-example:
  stage: verify
  image: python:3.12-slim
  variables:
    PYTHONDONTWRITEBYTECODE: "1"
  script:
    - mkdir -p artifacts
    - PYTHONPATH=src python -m tbaf.cli examples/review-input.json --policy examples/policy.json > artifacts/example-review-package.json
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - artifacts/example-review-package.json
