stages:
  - verify

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

python-contract:
  stage: verify
  image: python:3.12-slim
  variables:
    PYTHONDONTWRITEBYTECODE: "1"
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
  script:
    - python --version
    - PYTHONPATH=src python -m unittest discover -s tests -v

# This job exercises the deterministic router in GitLab CI and publishes its
# receipt. The input uses illustrative SHAs and is not evidence about this
# pipeline's own merge request; MR-bound capture and checks remain future work.
attention-router-example:
  stage: verify
  image: python:3.12-slim
  variables:
    PYTHONDONTWRITEBYTECODE: "1"
  script:
    - mkdir -p artifacts
    - PYTHONPATH=src python -m tbaf.cli examples/review-input.json --policy examples/policy.json > artifacts/example-review-package.json
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - artifacts/example-review-package.json

# Run only on the default branch when an operator explicitly supplies an MR
# IID. The job code and policy come from this default-branch revision; MR
# source is fetched as Git data and is never checked out or executed. The
# authorization invariant probe statically interprets a bounded AST subset.
attention-router-mr-snapshot:
  stage: verify
  image: python:3.12
  variables:
    GIT_DEPTH: "0"
    PYTHONDONTWRITEBYTECODE: "1"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $TBAF_MR_IID'
    - when: never
  script:
    - mkdir -p artifacts
    - PYTHONPATH=src python -m tbaf.gitlab_mr_snapshot "$TBAF_MR_IID" > artifacts/review-package.json
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - artifacts/review-package.json
