spec:
  inputs:
    mr_iid:
      type: string
      default: ""
      regex: '^([1-9][0-9]*)?$'
      description: "Optional merge request IID for an explicit snapshot run on the default branch."
---
include:
  - template: Jobs/SAST.gitlab-ci.yml

stages:
  - test
  - verify
  - deploy

variables:
  TBAF_MR_IID: "$[[ inputs.mr_iid ]]"
  AST_ENABLE_MR_PIPELINES: "true"

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

python-contract:
  stage: verify
  image: python:3.12-slim
  variables:
    PYTHONDONTWRITEBYTECODE: "1"
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
  script:
    - python --version
    - PYTHONPATH=src python -m unittest discover -s tests -v

# Run fixture-backed, deterministic router cases in an unprivileged job.
# NOT_EVALUABLE cases and contract matches are reported separately; this is
# not a security-detection benchmark and the job receives no deploy identity.
adversarial-router-cases:
  stage: verify
  image: python:3.12-slim
  variables:
    PYTHONDONTWRITEBYTECODE: "1"
  script:
    - PYTHONPATH=src python evaluation/run_cases.py

# This job exercises the deterministic router in GitLab CI and publishes its
# receipt. The input uses illustrative SHAs and is not evidence about this
# pipeline's own merge request; MR-bound capture and checks remain future work.
attention-router-example:
  stage: verify
  image: python:3.12-slim
  variables:
    PYTHONDONTWRITEBYTECODE: "1"
  script:
    - mkdir -p artifacts
    - PYTHONPATH=src python -m tbaf.cli examples/review-input.json --policy examples/policy.json > artifacts/example-review-package.json
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - artifacts/example-review-package.json

# Run only on the default branch when an operator explicitly supplies an MR
# IID. The job code and policy come from this default-branch revision; MR
# source is fetched as Git data and is never checked out or executed. The
# authorization invariant probe statically interprets a bounded AST subset.
attention-router-mr-snapshot:
  stage: verify
  image: python:3.12
  variables:
    GIT_DEPTH: "0"
    PYTHONDONTWRITEBYTECODE: "1"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $TBAF_MR_IID'
    - when: never
  script:
    - mkdir -p artifacts
    - PYTHONPATH=src python -m tbaf.gitlab_mr_snapshot "$TBAF_MR_IID" > artifacts/review-package.json
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - artifacts/review-package.json

# Join a confidential note from the configured Change Mapper service account
# to the exact snapshot head. The deterministic Review Package remains intact;
# API/token limitations produce a visible unavailable status artifact.
attention-router-link-duo-assessment:
  stage: verify
  image: python:3.12-slim
  variables:
    PYTHONDONTWRITEBYTECODE: "1"
  needs:
    - job: attention-router-mr-snapshot
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $TBAF_MR_IID'
    - when: never
  script:
    - mkdir -p artifacts/assessment-link
    - PYTHONPATH=src python -m tbaf.gitlab_assessment_link artifacts/review-package.json examples/gitlab-flow-integration.json artifacts/assessment-link
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - artifacts/assessment-link/assessment-link-status.json
      - artifacts/assessment-link/linked-review-package.json

# Static viewer deployment. OIDC credentials are short-lived and only
# issued for protected main after all project/identity variables are configured.
deploy-cloud-run-review-explorer:
  stage: deploy
  image: google/cloud-sdk:slim
  id_tokens:
    GCP_ID_TOKEN:
      aud: https://gitlab.com
  variables:
    CLOUDSDK_CONFIG: "$CI_PROJECT_DIR/.gcloud"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true" && $GCP_PROJECT_ID && $GCP_PROJECT_NUMBER && $GCP_WIF_POOL_ID && $GCP_WIF_PROVIDER_ID && $GCP_DEPLOYER_SERVICE_ACCOUNT && $GCP_RUNTIME_SERVICE_ACCOUNT && $GCP_BUILD_SERVICE_ACCOUNT && $GCP_REGION'
      when: manual
      allow_failure: false
    - when: never
  environment:
    name: cloud-run-demo
    url: $CLOUD_RUN_URL
  script:
    - umask 077
    - mkdir -p artifacts
    - mkdir -p "$CLOUDSDK_CONFIG"
    - printf '%s' "$GCP_ID_TOKEN" > "$CI_PROJECT_DIR/.gitlab-oidc-token"
    - 'gcloud iam workload-identity-pools create-cred-config "//iam.googleapis.com/projects/${GCP_PROJECT_NUMBER}/locations/global/workloadIdentityPools/${GCP_WIF_POOL_ID}/providers/${GCP_WIF_PROVIDER_ID}" --service-account="$GCP_DEPLOYER_SERVICE_ACCOUNT" --credential-source-file="$CI_PROJECT_DIR/.gitlab-oidc-token" --output-file="$CI_PROJECT_DIR/.gitlab-gcp-credentials.json"'
    - 'gcloud auth login --brief --cred-file="$CI_PROJECT_DIR/.gitlab-gcp-credentials.json"'
    - 'gcloud run deploy tbaf-review-explorer --source . --build-service-account "projects/${GCP_PROJECT_ID}/serviceAccounts/${GCP_BUILD_SERVICE_ACCOUNT}" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --service-account "$GCP_RUNTIME_SERVICE_ACCOUNT" --no-allow-unauthenticated --min 0 --max 1 --cpu 1 --memory 256Mi --quiet'
    - 'CLOUD_RUN_URL="$(gcloud run services describe tbaf-review-explorer --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format="value(status.url)")"'
    - 'CLOUD_RUN_REVISION="$(gcloud run services describe tbaf-review-explorer --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format="value(status.latestReadyRevisionName)")"'
    - 'printf "CLOUD_RUN_URL=%s\nCLOUD_RUN_REVISION=%s\nDEPLOYED_SOURCE_SHA=%s\n" "$CLOUD_RUN_URL" "$CLOUD_RUN_REVISION" "$CI_COMMIT_SHA" > artifacts/cloud-run-deployment.env'
    - 'printf "Deployed source SHA: %s\nRevision: %s\nURL: %s\n" "$CI_COMMIT_SHA" "$CLOUD_RUN_REVISION" "$CLOUD_RUN_URL"'
  after_script:
    - rm -f "$CI_PROJECT_DIR/.gitlab-oidc-token" "$CI_PROJECT_DIR/.gitlab-gcp-credentials.json"
  artifacts:
    when: always
    expire_in: 1 year
    reports:
      dotenv: artifacts/cloud-run-deployment.env
    paths:
      - artifacts/cloud-run-deployment.env
